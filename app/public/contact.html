<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · Pinch</title><link rel="stylesheet" href="/tb.css"></head><body><nav><a href="/">Pinch</a><a href="/tolybot.html">tolybot</a><a href="/check.html">Airdrop check</a><a href="/contact.html">Contact</a></nav>
<h1>Contact</h1><form id="c"><p><input id="e" type="email" required placeholder="your@email" style="width:70%"></p><p><textarea id="msg" required minlength="2" maxlength="5000" rows="6" style="width:90%" placeholder="Message"></textarea></p>
<input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button>Send</button> <span id="s"></span></form>
<footer>Built on Solana. Not affiliated with or endorsed by the Solana Foundation.<br>tolybot is an AI assistant, not Anatoly Yakovenko. Nothing here is financial advice and no returns are promised.<br>Contact: <a href="mailto:toly@mail.grokbot.com">toly@mail.grokbot.com</a></footer>
<script>c.onsubmit=async e=>{e.preventDefault();s.textContent="Sending...";const r=await fetch("/api/contact",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.getElementById("e").value,message:msg.value,website:website.value})});const j=await r.json();s.textContent=j.ok?"Sent. Thanks!":j.error}</script></body></html>
